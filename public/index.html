<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Research Operations</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Kernel chrome only: the sidebar frame (sections arrive as plugins),
       station switcher, plugin manager + customize entry points, status.
       Everything with domain identity mounts as a plugin. -->
  <header class="topbar">
    <button id="toggleSidebar" class="sidebar-toggle" title="Collapse or reopen the sidebar">☰</button>
    <div class="brand">Research Operations</div>
    <nav id="stationBar" class="station-bar" aria-label="Stations"></nav>
    <button id="openCustomize" class="plugins-btn" title="Appearance, sidebar and dashboard preferences for this workspace">Customize</button>
    <button id="openPluginManager">Plugins ⚙</button>
  </header>

  <div id="shell" class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Workspace navigation">
      <div class="sidebar-head">
        <button id="newWorkspace" title="Create a workspace — a composition profile over a folder">＋</button>
      </div>
      <div id="sidebarBody" class="sidebar-body"></div>
      <div class="sidebar-foot">
        <button id="sidebarNew" title="Create a file or folder">＋ New</button>
        <button id="sidebarPlugins" title="Enable stations and wire behaviors">Plugins</button>
      </div>
    </aside>
    <div id="sidebarResizer" class="sidebar-resizer" title="Drag to resize the sidebar"></div>
    <main id="stage" class="stage"></main>
  </div>

  <footer id="statusBar" class="statusbar">Ready.</footer>

  <dialog id="pluginManager" class="plugin-manager">
    <div class="pm-head">
      <strong>Plugins</strong>
      <button id="closePluginManager">Close</button>
    </div>
    <div id="pluginManagerBody" class="pm-body"></div>
  </dialog>

  <dialog id="customizeDialog" class="plugin-manager">
    <div class="pm-head">
      <strong>Customize workspace</strong>
      <button id="closeCustomize" type="button">Close</button>
    </div>
    <div id="customizeBody" class="pm-body"></div>
  </dialog>

  <dialog id="workspaceDialog" class="plugin-manager">
    <div class="pm-head"><strong>New workspace</strong><button id="closeWorkspaceDialog" type="button">Close</button></div>
    <form id="workspaceForm" method="dialog" class="ws-form">
      <label>Name <input id="wsName" placeholder="e.g. field notes" autocomplete="off"></label>
      <label>Folder path <input id="wsPath" class="mono" placeholder="/absolute/path/to/folder" required autocomplete="off"></label>
      <label class="ws-check"><input id="wsCreate" type="checkbox" checked> Create the folder if it does not exist</label>
      <div class="muted">A workspace is a composition profile: it starts empty, with no stations enabled. Uncheck the box to register an existing folder as-is.</div>
      <div class="ws-actions"><button class="primary" value="ok">Create workspace</button></div>
    </form>
  </dialog>

  <script type="module" src="/kernel.js"></script>
</body>
</html>

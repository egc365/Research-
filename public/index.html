<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Research Operations</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">WORKBENCH</div>
      <h1>Research Operations</h1>
    </div>
    <div class="toolbar">
      <select id="workspaceSelect" aria-label="Workspace"></select>
      <button id="addWorkspace">Add path</button>
      <button id="saveFile" class="primary">Save</button>
    </div>
  </header>

  <main class="shell">
    <aside class="tree-pane">
      <div class="pane-title">Workspace</div>
      <div id="tree" class="tree"></div>
    </aside>

    <section class="editor-pane">
      <div class="editor-head">
        <div>
          <div id="fileName" class="file-name">Select a file</div>
          <div id="fileMeta" class="muted"></div>
        </div>
        <div id="stateBadge" class="badge">—</div>
      </div>
      <textarea id="editor" spellcheck="false" disabled placeholder="Select a file in the tree to edit it here."></textarea>
      <div id="centerStation" class="center-station" hidden></div>
      <div id="statusBar" class="statusbar">Ready.</div>
    </section>

    <aside class="control-pane">
      <div class="pane-title">Stations</div>
      <div id="stationList" class="stations"></div>
      <div id="stationHeader" class="station-header" hidden></div>
      <div id="pluginPanel" class="plugin-panel">
        <div class="empty">Pick a station to open its controls here.</div>
      </div>
    </aside>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
